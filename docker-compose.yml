services:
  auditor:
    build: .
    image: compliance-auditor:local
    ports:
      - "127.0.0.1:8501:8501"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - auditor-data:/var/lib/auditor
    environment:
      AUDITOR_MAX_UPLOAD_MB: "5"
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 1g

volumes:
  auditor-data:
