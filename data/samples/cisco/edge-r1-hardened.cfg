!
version 17.9
hostname edge-r1
!
service timestamps log datetime msec localtime show-timezone
service password-encryption
!
enable secret 9 $9$HardenedSecretHashValue
username admin secret 9 $9$AdminSecretHashValue
aaa new-model
aaa authentication login default group tacacs+ local
login block-for 120 attempts 3 within 60
!
tacacs server TAC1
 address ipv4 10.10.20.5
 key 7 0822455D0A16
!
ip domain-name example.local
ip ssh version 2
no ip http server
no ip http secure-server
no ip source-route
!
logging on
logging host 10.10.20.9
logging trap informational
ntp server 10.10.10.1
ntp server 10.10.10.2
!
banner login #Authorized access only. Activity is monitored and logged.#
!
snmp-server user monitor MONGRP v3 auth sha AuthPassPhrase123 priv aes 128 PrivPassPhrase123
!
ip access-list standard MGMT-ACCESS
 permit 10.10.30.0 0.0.0.255
 deny any log
!
ip access-list extended WAN-IN
 permit tcp any host 203.0.113.2 eq 443
 deny ip any any log
!
interface GigabitEthernet0/0
 description WAN uplink
 ip address 203.0.113.2 255.255.255.252
 ip access-group WAN-IN in
 no ip redirects
 no ip directed-broadcast
 ip verify unicast source reachable-via rx
!
interface GigabitEthernet0/1
 description LAN
 ip address 10.1.0.1 255.255.255.0
 no ip redirects
 no ip directed-broadcast
!
line con 0
 exec-timeout 10 0
line vty 0 4
 exec-timeout 10 0
 access-class MGMT-ACCESS in
 login local
 transport input ssh
!
end
