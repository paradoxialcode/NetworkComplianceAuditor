#config-version=FGT60F-7.0.1-FW-build0157-210101:opmode=0:vdom=0:user=admin
config system global
    set hostname "FW-HQ-01"
    set admintimeout 60
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set password ENC SH2weakAdminHashValue
    next
end
config system interface
    edit "wan1"
        set ip 203.0.113.10 255.255.255.248
        set allowaccess ping http telnet ssh
        set icmp-redirect enable
    next
    edit "lan"
        set ip 10.1.0.1 255.255.255.0
        set allowaccess ping https ssh http
    next
end
config system snmp community
    edit 1
        set name "public"
        set status enable
    next
end
config system ntp
    set ntpsync enable
    config ntpserver
        edit 1
            set server "10.10.10.1"
        next
    end
end
config firewall policy
    edit 1
        set name "allow-all"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "ALL"
    next
end
