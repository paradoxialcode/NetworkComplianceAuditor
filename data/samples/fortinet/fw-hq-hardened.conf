#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system global
    set hostname "FW-HQ-01"
    set admintimeout 10
    set admin-lockout-threshold 3
    set admin-lockout-duration 120
    set strong-crypto enable
    set pre-login-banner enable
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set trusthost1 10.10.30.0 255.255.255.0
        set password ENC SH2hardenedAdminHashValue
    next
end
config system interface
    edit "wan1"
        set ip 203.0.113.10 255.255.255.248
        set allowaccess ping
        set icmp-redirect disable
    next
    edit "lan"
        set ip 10.1.0.1 255.255.255.0
        set allowaccess ping https ssh
        set icmp-redirect disable
    next
end
config system snmp user
    edit "monitor"
        set security-level auth-priv
        set auth-pwd ENC SNMPAuthHashValue
    next
end
config system ntp
    set ntpsync enable
    config ntpserver
        edit 1
            set server "10.10.10.1"
        next
        edit 2
            set server "10.10.10.2"
        next
    end
end
config log syslogd setting
    set status enable
    set server "10.10.20.9"
    set severity information
end
config system replacemsg admin "pre_admin-disclaimer-text"
    set buffer "Authorized access only. Activity is monitored and logged."
end
config user radius
    edit "RADIUS1"
        set server "10.10.20.5"
        set secret ENC RadiusSecretHashValue
    next
end
config firewall policy
    edit 1
        set name "lan-to-web"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "lan-net"
        set dstaddr "all"
        set action accept
        set service "HTTPS" "HTTP"
    next
end
config system settings
    set strict-src-check enable
end
