# Engine format (auditor/compliance/models.py). Converted from Part C format.
checks:
- id: MGT-001
  title: Telnet is disabled
  severity: high
  condition:
    field: management.telnet
    op: eq
    value: DISABLED
    on_missing: fail
  mappings:
    nist:
    - AC-17
    - CM-7
    - SC-8
    cis:
    - '4.8'
    - '12.6'
    iso27001:
    - A.8.20
    - A.8.24
  remediation_key: disable_telnet
- id: MGT-002
  title: SSH is enabled
  severity: high
  condition:
    field: management.ssh
    op: eq
    value: ENABLED
    on_missing: fail
  mappings:
    nist:
    - AC-17
    - SC-8
    cis:
    - '12.6'
    iso27001:
    - A.8.20
  remediation_key: enable_ssh
- id: MGT-003
  title: SSH version 2 only
  severity: high
  condition:
    field: facts.ssh_version.value
    op: gte
    value: 2
    on_missing: fail
  mappings:
    nist:
    - SC-8
    - SC-13
    cis:
    - '12.6'
    iso27001:
    - A.8.24
  remediation_key: enforce_ssh_v2
- id: MGT-004
  title: Plain HTTP management server is disabled
  severity: medium
  condition:
    field: management.http
    op: eq
    value: DISABLED
    on_missing: pass
  mappings:
    nist:
    - CM-7
    - SC-8
    cis:
    - '4.8'
    - '12.6'
    iso27001:
    - A.8.20
  remediation_key: disable_http_server
- id: MGT-005
  title: Idle session timeout is 10 minutes or less
  severity: medium
  condition:
    field: facts.exec_timeout_minutes.value
    op: lte
    value: 10
    on_missing: fail
  mappings:
    nist:
    - AC-11
    - AC-12
    cis:
    - '4.3'
    iso27001:
    - A.8.5
  remediation_key: set_session_timeout
- id: MGT-006
  title: Default SNMP community strings are not used
  severity: critical
  condition:
    field: facts.snmp_default_community.value
    op: eq
    value: false
    on_missing: pass
  mappings:
    nist:
    - IA-5
    - CM-6
    cis:
    - '4.7'
    iso27001:
    - A.5.17
  remediation_key: remove_default_snmp_community
- id: MGT-007
  title: Login warning banner is configured
  severity: low
  condition:
    field: facts.login_banner_present.value
    op: eq
    value: true
    on_missing: fail
  mappings:
    nist:
    - AC-8
    cis:
    - '4.1'
    iso27001:
    - A.5.10
  remediation_key: set_login_banner
