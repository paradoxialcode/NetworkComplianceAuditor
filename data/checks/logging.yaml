# Engine format (auditor/compliance/models.py). Converted from Part C format.
checks:
- id: LOG-001
  title: Logging is enabled
  severity: medium
  condition:
    field: logging.enabled
    op: eq
    value: ENABLED
    on_missing: fail
  mappings:
    nist:
    - AU-2
    - AU-12
    cis:
    - '8.2'
    iso27001:
    - A.8.15
  remediation_key: enable_logging
- id: LOG-002
  title: At least one remote syslog server
  severity: high
  condition:
    field: logging.destinations
    op: non_empty
    on_missing: fail
  mappings:
    nist:
    - AU-6
    - AU-9
    cis:
    - '8.9'
    iso27001:
    - A.8.15
  remediation_key: configure_remote_syslog
- id: LOG-003
  title: Log timestamps are enabled
  severity: low
  condition:
    field: facts.timestamps_enabled.value
    op: eq
    value: true
    on_missing: fail
  mappings:
    nist:
    - AU-3
    - AU-8
    cis:
    - '8.5'
    iso27001:
    - A.8.15
  remediation_key: enable_log_timestamps
  vendors:
  - cisco
  - juniper
- id: LOG-004
  title: At least two NTP servers are configured
  severity: medium
  condition:
    field: facts.ntp_server_count.value
    op: gte
    value: 2
    on_missing: fail
  mappings:
    nist:
    - AU-8
    - SC-45
    cis:
    - '8.4'
    iso27001:
    - A.8.17
  remediation_key: configure_ntp
- id: LOG-005
  title: Log level is informational (6) or more detailed
  severity: low
  condition:
    field: facts.trap_level_numeric.value
    op: gte
    value: 6
    on_missing: fail
  mappings:
    nist:
    - AU-2
    - AU-12
    cis:
    - '8.5'
    iso27001:
    - A.8.15
  remediation_key: set_log_level
