# Category: logging  (syslog, time sync, audit events)
- id: LOG-001
  title: Logging is enabled
  category: logging
  severity: medium
  description: The device must generate log messages.
  applies_to: [cisco, fortinet, junos]
  field: logging.enabled
  operator: equals
  expected: true
  on_missing: fail
  nist: [AU-2, AU-12]
  remediation_key: enable_logging

- id: LOG-002
  title: At least one remote syslog server
  category: logging
  severity: high
  description: Logs must be sent off-device so they survive tampering or failure.
  applies_to: [cisco, fortinet, junos]
  field: logging.remote_server_count
  operator: gte
  expected: 1
  on_missing: fail
  nist: [AU-6, AU-9]
  remediation_key: configure_remote_syslog

- id: LOG-003
  title: Log timestamps are enabled
  category: logging
  severity: low
  description: Every log line needs a date and time for investigation.
  applies_to: [cisco, fortinet, junos]
  field: logging.timestamps_enabled
  operator: equals
  expected: true
  on_missing: fail
  nist: [AU-3, AU-8]
  remediation_key: enable_log_timestamps

- id: LOG-004
  title: At least two NTP servers are configured
  category: logging
  severity: medium
  description: Accurate, synchronised time is required for reliable logs.
  applies_to: [cisco, fortinet, junos]
  field: logging.ntp_server_count
  operator: gte
  expected: 2
  on_missing: fail
  nist: [AU-8, SC-45]
  remediation_key: configure_ntp

- id: LOG-005
  title: Log level is informational (6) or more detailed
  category: logging
  severity: low
  description: Syslog severity 6 (informational) or higher must be captured.
  applies_to: [cisco, fortinet, junos]
  field: logging.trap_level_numeric
  operator: gte
  expected: 6
  on_missing: fail
  nist: [AU-2, AU-12]
  remediation_key: set_log_level
