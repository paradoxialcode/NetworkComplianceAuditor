# Engine format (auditor/compliance/models.py). Converted from Part C format.
checks:
- id: AUTH-001
  title: AAA is enabled
  severity: high
  condition:
    field: auth.aaa
    op: eq
    value: ENABLED
    on_missing: fail
  mappings:
    nist:
    - IA-2
    - AC-3
  remediation_key: enable_aaa
- id: AUTH-002
  title: Central authentication server (TACACS+/RADIUS) is configured
  severity: medium
  condition:
    field: facts.remote_auth_server_count.value
    op: gte
    value: 1
    on_missing: fail
  mappings:
    nist:
    - IA-2
    - AC-2
  remediation_key: configure_remote_auth
- id: AUTH-003
  title: Password encryption is enabled
  severity: high
  condition:
    field: facts.password_encryption.value
    op: eq
    value: true
    on_missing: fail
  mappings:
    nist:
    - IA-5
  remediation_key: enable_password_encryption
- id: AUTH-004
  title: No plain-text passwords in configuration
  severity: critical
  condition:
    field: facts.plaintext_password_count.value
    op: eq
    value: 0
    on_missing: fail
  mappings:
    nist:
    - IA-5
  remediation_key: remove_plaintext_passwords
- id: AUTH-005
  title: Login lockout after 5 or fewer failed attempts
  severity: medium
  condition:
    field: facts.max_login_attempts.value
    op: lte
    value: 5
    on_missing: fail
  mappings:
    nist:
    - AC-7
  remediation_key: set_login_lockout
- id: AUTH-006
  title: Privileged mode uses a secret (hashed) password
  severity: high
  vendors:
  - cisco
  - juniper
  condition:
    field: facts.privileged_secret_set.value
    op: eq
    value: true
    on_missing: fail
  mappings:
    nist:
    - IA-5
    - AC-6
  remediation_key: set_enable_secret
