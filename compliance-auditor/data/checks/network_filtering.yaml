# Engine format (auditor/compliance/models.py). Converted from Part C format.
checks:
- id: NET-001
  title: IP source routing is disabled
  severity: medium
  condition:
    field: facts.ip_source_route_enabled.value
    op: eq
    value: false
    on_missing: pass
  mappings:
    nist:
    - CM-7
    - SC-7
  remediation_key: disable_source_routing
- id: NET-002
  title: IP directed broadcast is disabled
  severity: medium
  condition:
    field: facts.directed_broadcast_enabled.value
    op: eq
    value: false
    on_missing: pass
  mappings:
    nist:
    - SC-5
    - SC-7
  remediation_key: disable_directed_broadcast
- id: NET-003
  title: ICMP redirects are disabled
  severity: low
  condition:
    field: facts.icmp_redirects_enabled.value
    op: eq
    value: false
    on_missing: pass
  mappings:
    nist:
    - SC-7
    - CM-7
  remediation_key: disable_icmp_redirects
- id: NET-004
  title: Management access is restricted by ACL / trusted hosts
  severity: high
  condition:
    field: facts.mgmt_access_restricted.value
    op: eq
    value: true
    on_missing: fail
  mappings:
    nist:
    - AC-3
    - AC-17
    - SC-7
  remediation_key: restrict_mgmt_access
- id: NET-005
  title: No "permit any any" rules
  severity: high
  condition:
    field: facts.permit_any_any_count.value
    op: eq
    value: 0
    on_missing: fail
  mappings:
    nist:
    - SC-7
    - AC-4
  remediation_key: remove_permit_any_any
- id: NET-006
  title: Anti-spoofing (uRPF / reverse-path check) is enabled
  severity: medium
  condition:
    field: facts.antispoofing_enabled.value
    op: eq
    value: true
    on_missing: fail
  mappings:
    nist:
    - SC-7
  remediation_key: enable_antispoofing
