# Category: management  (remote access, services, SNMP, sessions)
# Schema: see docs/check_schema.md
- id: MGT-001
  title: Telnet is disabled
  category: management
  severity: high
  description: Telnet sends credentials in clear text. Management access must use SSH.
  applies_to: [cisco, fortinet, junos]
  field: management.telnet_enabled
  operator: equals
  expected: false
  on_missing: fail
  nist: [AC-17, CM-7, SC-8]
  remediation_key: disable_telnet

- id: MGT-002
  title: SSH is enabled
  category: management
  severity: high
  description: Encrypted remote management (SSH) must be available.
  applies_to: [cisco, fortinet, junos]
  field: management.ssh_enabled
  operator: equals
  expected: true
  on_missing: fail
  nist: [AC-17, SC-8]
  remediation_key: enable_ssh

- id: MGT-003
  title: SSH version 2 only
  category: management
  severity: high
  description: SSH version 1 has known cryptographic weaknesses.
  applies_to: [cisco, fortinet, junos]
  field: management.ssh_version
  operator: gte
  expected: 2
  on_missing: fail
  nist: [SC-8, SC-13]
  remediation_key: enforce_ssh_v2

- id: MGT-004
  title: Plain HTTP management server is disabled
  category: management
  severity: medium
  description: The unencrypted HTTP management interface must be turned off.
  applies_to: [cisco, fortinet, junos]
  field: management.http_server_enabled
  operator: equals
  expected: false
  on_missing: pass
  nist: [CM-7, SC-8]
  remediation_key: disable_http_server

- id: MGT-005
  title: Idle session timeout is 10 minutes or less
  category: management
  severity: medium
  description: Idle management sessions must be closed automatically.
  applies_to: [cisco, fortinet, junos]
  field: management.exec_timeout_minutes
  operator: lte
  expected: 10
  on_missing: fail
  nist: [AC-11, AC-12]
  remediation_key: set_session_timeout

- id: MGT-006
  title: Default SNMP community strings are not used
  category: management
  severity: critical
  description: Communities like "public" or "private" give attackers easy read/write access.
  applies_to: [cisco, fortinet, junos]
  field: management.snmp_default_community
  operator: equals
  expected: false
  on_missing: pass
  nist: [IA-5, CM-6]
  remediation_key: remove_default_snmp_community

- id: MGT-007
  title: Login warning banner is configured
  category: management
  severity: low
  description: A legal/system-use notice must be shown before login.
  applies_to: [cisco, fortinet, junos]
  field: management.login_banner_present
  operator: equals
  expected: true
  on_missing: fail
  nist: [AC-8]
  remediation_key: set_login_banner
